# Sellandiamman Estates production stack. See DEPLOYMENT.md.
#   cp .env.example .env && cp backend/.env.example backend/.env   (fill in both)
#   docker compose up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: estates
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://estates:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      UPLOAD_DIR: /data/uploads
      SITE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      CORS_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"
    volumes: ["uploads:/data/uploads"]
    depends_on:
      mongo: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        SITE_URL: https://${DOMAIN}
        MAP_TILES: ${MAP_TILES:-}
        MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["caddy_data:/data", "caddy_config:/config"]
    depends_on: [backend]

  backup:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://estates:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-sellandiamman_estates}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes: ["./backups:/backups", "uploads:/data/uploads:ro", "./scripts:/scripts:ro"]
    entrypoint: ["bash", "/scripts/backup-loop.sh"]
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongo_data:
  uploads:
  caddy_data:
  caddy_config:
