services:
  mongo:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]
    depends_on: [mongo]
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "yarn install --frozen-lockfile && yarn build && npx serve -s build -l 3000"
    environment:
      REACT_APP_BACKEND_URL: ${PUBLIC_URL}
    depends_on: [backend]
# Put a reverse proxy (nginx/Caddy) in front: route /api/* -> backend:8001, everything else -> frontend:3000, with HTTPS.
volumes:
  mongo_data:
  uploads:
