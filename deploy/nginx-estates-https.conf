# nginx site for Sellandiamman Estates once the certificate exists (see DEPLOYMENT.md, "Sharing a server").
# Plain http and the bare domain go to https://www; https is passed to the Docker stack on 127.0.0.1:8088.
# Install:  sudo tee /etc/nginx/sites-enabled/sellandiammanestates < deploy/nginx-estates-https.conf
#           sudo nginx -t && sudo systemctl reload nginx
# Updates (git pull) never need this file copied again.
server {
    listen 80;
    listen [::]:80;
    server_name www.sellandiammanestates.com sellandiammanestates.com;
    return 301 https://www.sellandiammanestates.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sellandiammanestates.com sellandiammanestates.com;

    ssl_certificate /etc/letsencrypt/live/www.sellandiammanestates.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sellandiammanestates.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
