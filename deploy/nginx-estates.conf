# nginx site for a server that already runs nginx for other websites (see DEPLOYMENT.md, "Sharing a server").
# nginx answers on 80/443 and passes everything to the Docker stack on 127.0.0.1:8088. HTTPS is added by certbot:
#   certbot --nginx -d www.sellandiammanestates.com -d sellandiammanestates.com --redirect
# The bare domain is sent on to https://www. by the app itself.
server {
    listen 80;
    listen [::]:80;
    server_name www.sellandiammanestates.com sellandiammanestates.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
